[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeonflayer"
version = "0.1.0"
description = "A Mineflayer-style API for Minecraft Dungeons, built from pixels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
live = ["mss", "dxcam", "vgamepad", "pydirectinput", "opencv-python"]

[tool.setuptools]
packages = ["dungeonflayer"]
